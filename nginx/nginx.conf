events {
    worker_connections 1024;
}

http {
    # Include default MIME types so CSS and JS render correctly
    include /etc/nginx/mime.types;

    server {
        # Listen on standard HTTP port
        listen 80;

        # 1. SERVE THE FRONTEND
        # If the user asks for the root directory, give them the HTML file
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # 2. ROUTE TO AUTH SERVICE
        # If the URL starts with /api/auth, strip that prefix and send it to the auth container
        location /api/auth/ {
            proxy_pass http://auth:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. ROUTE TO POKEMON SERVICE
        # If the URL starts with /api/team, strip that prefix and send it to the pokemon container
        location /api/team/ {
            proxy_pass http://pokemon-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}