version: '3.9'

services:

  # ─────────────────────────────────────────────
  # POKÉMON API SERVICE
  # ─────────────────────────────────────────────
  pokemon-api:
    build:
      context: ./services/pokemon-api
      dockerfile: Dockerfile
    container_name: pokemon-api
    ports:
      - "8000:8000"                    # Access in browser: http://localhost:8000
    volumes:
      - ./services/pokemon-api:/app    # Hot-reload during development
    environment:
      - PYTHONUNBUFFERED=1
      - POKEMON_PORT=8000
      - AUTH_SERVICE_URL=http://auth:8001   # ← How pokemon-api talks to auth
      # Example Azure SQL connection (uncomment and fill when ready)
      # - DATABASE_URL=postgresql+psycopg2://user:password@your-azure-sql-server.database.windows.net:5432/dbname?sslmode=require
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - auth
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # AUTH SERVICE
  # ─────────────────────────────────────────────
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: auth
    ports:
      - "8001:8000"                    # Access in browser: http://localhost:8001
    volumes:
      - ./services/auth:/app           # Hot-reload during development
    environment:
      - PYTHONUNBUFFERED=1
      - AUTH_PORT=8000
      - POKEMON_SERVICE_URL=http://pokemon-api:8000   # ← How auth talks to pokemon-api
      # Example Azure SQL connection (uncomment and fill when ready)
      # - DATABASE_URL=postgresql+psycopg2://user:password@your-azure-sql-server.database.windows.net:5432/dbname?sslmode=require
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

