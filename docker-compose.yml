version: '3.9'

services:

  # ─────────────────────────────────────────────
  # TIER 1: API GATEWAY & FRONTEND (NGINX)
  # ─────────────────────────────────────────────
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"                        # The ONLY public port. Access at http://localhost
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/frontend:/usr/share/nginx/html:ro
    depends_on:
      - auth
      - pokemon-api
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # AUTH SERVICE
  # ─────────────────────────────────────────────
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: auth
    volumes:
      - ./services/auth:/app
    env_file:
      - ./.env # <-- Pulls SECRET_KEY, ALGORITHM, etc., from your root file
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_PORT=8000
      - POKEMON_SERVICE_URL=http://pokemon-api:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # POKÉMON API SERVICE
  # ─────────────────────────────────────────────
  pokemon-api:
    build:
      context: ./services/pokemon-api
      dockerfile: Dockerfile
    container_name: pokemon-api
    ports:
      - "8000:8000"
    volumes:
      - ./services/pokemon-api:/app
    env_file:
      - ./.env # <-- Pulls SECRET_KEY, ALGORITHM, etc., from your root file
    environment:
      - PYTHONUNBUFFERED=1
      - POKEMON_PORT=8000
      - AUTH_SERVICE_URL=http://auth:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      auth:
        condition: service_healthy
    restart: unless-stopped



